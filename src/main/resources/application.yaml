spring:
  application:
    name: smart-knowledge-hub
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
  ai:
    model:
      chat: ${AI_MODEL_CHAT:openai}
      embedding: ${AI_MODEL_EMBEDDING:openai}
    openai:
      api-key: ${OPENAI_API_KEY:sk-3e3823d6948b40d18fe5fcaa09326818}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:sk-08a90311e3cb458dbe57a2244c4b38b5}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        enabled: ${DEEPSEEK_CHAT_ENABLED:true}
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3}
    vectorstore:
      chroma:
        initialize-schema: ${CHROMA_INIT_SCHEMA:true}
        tenant-name: ${CHROMA_TENANT:default_tenant}
        database-name: ${CHROMA_DATABASE:default_database}
        collection-name: ${CHROMA_COLLECTION:vector_store}
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
          key-token: ${CHROMA_TOKEN:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    com.smartknowledgehub: DEBUG

app:
  vector:
    enabled: false
  search:
    enabled: ${OPENSEARCH_ENABLED:false}
    base-url: ${OPENSEARCH_BASE_URL:http://localhost:9200}
    index-name: ${OPENSEARCH_INDEX:chunks}
    auto-create: ${OPENSEARCH_AUTO_CREATE:true}
    analyzer: ${OPENSEARCH_ANALYZER:standard}
    search-analyzer: ${OPENSEARCH_SEARCH_ANALYZER:standard}
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
  rewrite:
    enabled: ${QUERY_REWRITE_ENABLED:false}
    provider: ${QUERY_REWRITE_PROVIDER:AUTO}
    max-length: ${QUERY_REWRITE_MAX_LENGTH:256}
  retrieval:
    top-k: ${RETRIEVAL_TOP_K:5}
    similarity-threshold: ${RETRIEVAL_SIMILARITY_THRESHOLD:0.7}
    rrf-k: ${RETRIEVAL_RRF_K:60}
  persistence:
    postgres:
      enabled: ${POSTGRES_ENABLED:false}
      url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/smart_knowledge_hub}
      username: ${POSTGRES_USERNAME:postgres}
      password: ${POSTGRES_PASSWORD:postgres}
      init-schema: ${POSTGRES_INIT_SCHEMA:true}
